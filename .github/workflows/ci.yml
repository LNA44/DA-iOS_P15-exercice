name: IOS Build and Test

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Clean previous test results
        run: rm -rf TestResults
    
      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
            project: EPCollaboratif.xcodeproj
            scheme: EPCollaboratif
            destination: 'platform=iOS Simulator,name=iPhone 16,OS=18.5,arch=arm64'
            action: test
            result-bundle-path: 'TestResults/TestResults.xcresult'
            
      - name: Check xcresult folder
        run: ls -la TestResults/
            
      - name: Process Test Results
        uses: tbartelmess/analyze-xcoderesults-action@0.1.0
        if: always()
        with:
          results: TestResults/TestResults.xcresult
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
