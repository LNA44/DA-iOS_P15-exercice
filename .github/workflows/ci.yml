name: IOS Build and Test

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Clean previous test results
        run: rm -rf TestResults
        
      - name: List available simulators
        run: xcrun simctl list devices
    
      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
            project: EPCollaboratif.xcodeproj
            scheme: EPCollaboratif
            destination: 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
            action: test
            result-bundle-path: 'TestResults/TestResults.xcresult'
            
      - name: Install xcbeautify
        if: success() || failure()
        run: brew install xcbeautify
            
      - name: Convert to JUnit
        if: success() || failure()
        run: |
            xcrun xcresulttool get --format json --path TestResults/TestResults.xcresult | \
            xcbeautify --renderer junit > junit.xml || echo "Conversion failed"

      - name: Test Summary
        uses: test-summary/action@v2
        if: success() || failure()
        with:
            paths: junit.xml
            show: "fail, skip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        if: success() || failure()
        with:
            name: test-results
            path: |
                TestResults/TestResults.xcresult
                junit.xml
